[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "optverify"
version = "0.1.0"
description = "LLM-to-LP formulation benchmark with OR-Tools verification"
requires-python = ">=3.10"
dependencies = [
  "ortools>=9.8",
  "pydantic>=2.5",
  "typer>=0.12",
  "rich>=13.7"
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.4"]
llm = ["openai>=1.30"]

[project.scripts]
optverify = "optverify.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
